# ---------- APP 2: nginx ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-nginx
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels: { app: app2 }
  template:
    metadata:
      labels: { app: app2 }
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app2-svc
  namespace: parcial-daa
spec:
  selector: { app: app2 }
  ports: [{ port: 80, targetPort: 80 }]
---