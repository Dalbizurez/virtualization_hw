apiVersion: v1
kind: Namespace
metadata:
  name: parcial-daa
---
# ---------- APP 1: whoami ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app1-whoami
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels: { app: app1 }
  template:
    metadata:
      labels: { app: app1 }
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:latest
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app1-svc
  namespace: parcial-daa
spec:
  selector: { app: app1 }
  ports: [{ port: 80, targetPort: 80 }]
---
# ---------- APP 2: nginx ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2-nginx
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels: { app: app2 }
  template:
    metadata:
      labels: { app: app2 }
    spec:
      containers:
        - name: nginx
          image: nginx:stable
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app2-svc
  namespace: parcial-daa
spec:
  selector: { app: app2 }
  ports: [{ port: 80, targetPort: 80 }]
---
# ---------- APP 3: apache httpd ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-httpd
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels: { app: app3 }
  template:
    metadata:
      labels: { app: app3 }
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app3-svc
  namespace: parcial-daa
spec:
  selector: { app: app3 }
  ports: [{ port: 80, targetPort: 80 }]
---
# ---------- APP 4: http-echo ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4-echo
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels: { app: app4 }
  template:
    metadata:
      labels: { app: app4 }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:latest
          args: ["-text=Hola desde la APP 4", "-listen=:5678"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app4-svc
  namespace: parcial-daa
spec:
  selector: { app: app4 }
  ports: [{ port: 80, targetPort: 5678 }]