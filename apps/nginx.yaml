apiVersion: apps/v1
kind: Deployment
metadata:
  name: app2
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app2
  template:
    metadata:
      labels:
        app: app2
    spec:
      containers:
        - name: app2
          image: nginx/latest
          args: ["-text=Hola desde ngninx"]
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app2
  namespace: parcial-daa
spec:
  type: ClusterIP
  selector:
    app: app2
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app2
  namespace: parcial-daa
spec:
  ingressClassName: traefik
  rules:
    - host: app2.midominio.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app2
                port:
                  number: 80