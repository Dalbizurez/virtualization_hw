# ---------- APP 4: http-echo ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app4-echo
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels: { app: app4 }
  template:
    metadata:
      labels: { app: app4 }
    spec:
      containers:
        - name: echo
          image: hashicorp/http-echo:latest
          args: ["-text=Hola desde la APP 4", "-listen=:5678"]
          ports: [{ containerPort: 5678 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app4-svc
  namespace: parcial-daa
spec:
  selector: { app: app4 }
  ports: [{ port: 80, targetPort: 5678 }]