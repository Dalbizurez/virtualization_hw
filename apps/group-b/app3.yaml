# ---------- APP 3: apache httpd ----------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3-httpd
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels: { app: app3 }
  template:
    metadata:
      labels: { app: app3 }
    spec:
      containers:
        - name: httpd
          image: httpd:2.4
          ports: [{ containerPort: 80 }]
---
apiVersion: v1
kind: Service
metadata:
  name: app3-svc
  namespace: parcial-daa
spec:
  selector: { app: app3 }
  ports: [{ port: 80, targetPort: 80 }]
---