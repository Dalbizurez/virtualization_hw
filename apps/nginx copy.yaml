apiVersion: apps/v1
kind: Deployment
metadata:
  name: app3
  namespace: parcial-daa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app3
  template:
    metadata:
      labels:
        app: app3
    spec:
      containers:
        - name: app3
          image: nginx/latest
          args: ["-text=Hola desde ngninx"]
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: app3
  namespace: parcial-daa
spec:
  type: ClusterIP
  selector:
    app: app3
  ports:
    - port: 80
      targetPort: 80
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: app3
  namespace: parcial-daa
spec:
  ingressClassName: traefik
  rules:
    - host: app3.midominio.test
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: app3
                port:
                  number: 80